<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lav Shoes Custos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de celular em coluna única (máx. 520px) com barra de abas flutuante: Painel, Materiais, Estoque, Serviços e Pedidos.
   Identidade: a mesma do Lav Shoes Caixa (azul, prata e branco, Plus Jakarta Sans). Cada tela abre com um cartão azul-resumo; o resto são cartões brancos. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --soft:#F2F5F9; --ink:#0F1B2D; --ink2:#66758B; --line:#E2E8F0; --track:#E7ECF3;
  --accent:#2563EB; --accent-2:#0EA5E9; --accent-ink:#FFFFFF; --accent-soft:#E6EEFF;
  --good:#0F8A5F; --good-soft:#DDF5EA;
  --warn:#9A6100; --warn-soft:#FFF1D6; --warn-bar:#F2A516; --bad:#D03A2B; --bad-soft:#FDE6E3; --on-bad:#FFFFFF;
  --grad-pj:linear-gradient(135deg,#1D4ED8 0%,#2563EB 42%,#0EA5E9 100%);
  --hero-fg:#FFFFFF; --hero-sub:rgba(255,255,255,.8); --hero-neg:#FFD3CB;
  --glass:rgba(255,255,255,.88);
  --shadow:0 1px 2px rgba(15,27,45,.04),0 10px 30px -12px rgba(15,27,45,.14);
  --shadow-pj:0 18px 40px -18px rgba(37,99,235,.65);
  --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#eda100; --c4:#e87ba4; --c5:#008300; --c6:#6250d6; --c7:#e34948;
  --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070C17; --surface:#111A2B; --soft:#18233A; --ink:#EAF0F8; --ink2:#8D9AB0; --line:#223049; --track:#1F2A40;
    --accent:#4C8DFF; --accent-2:#22B8F0; --accent-soft:#16264A;
    --good:#3DD39A; --good-soft:#0F2A22; --warn:#F5C35B; --warn-soft:#2E2410; --warn-bar:#F0B429; --bad:#FF8A7A; --bad-soft:#3A1713; --on-bad:#3A1713;
    --grad-pj:linear-gradient(135deg,#1E3A8A 0%,#2563EB 50%,#0284C7 100%);
    --glass:rgba(17,26,43,.88);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
    --shadow-pj:0 18px 40px -18px rgba(37,99,235,.55);
    --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070C17; --surface:#111A2B; --soft:#18233A; --ink:#EAF0F8; --ink2:#8D9AB0; --line:#223049; --track:#1F2A40;
  --accent:#4C8DFF; --accent-2:#22B8F0; --accent-soft:#16264A;
  --good:#3DD39A; --good-soft:#0F2A22; --warn:#F5C35B; --warn-soft:#2E2410; --warn-bar:#F0B429; --bad:#FF8A7A; --bad-soft:#3A1713; --on-bad:#3A1713;
  --grad-pj:linear-gradient(135deg,#1E3A8A 0%,#2563EB 50%,#0284C7 100%);
  --glass:rgba(17,26,43,.88);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  --shadow-pj:0 18px 40px -18px rgba(37,99,235,.55);
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  background:radial-gradient(900px 420px at 110% -8%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 62%),
             radial-gradient(700px 360px at -20% 4%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%), var(--bg);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.top{padding:2px 2px 16px}
.mark{display:block;font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1.15}
.sub2{display:block;font-size:12.5px;color:var(--ink2);font-weight:500;margin-top:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack>*{min-width:0}
.cols,.col{display:contents}
.main{min-width:0}
.brand{display:none}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:500;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.banner button{background:none;border:0;color:var(--accent);font-weight:800;padding:6px 2px;white-space:nowrap}
.banner:empty{display:none}
/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.01em}
.hero{position:relative;overflow:hidden;background:var(--grad-pj);color:var(--hero-fg);border-radius:26px;padding:24px 22px 22px;box-shadow:var(--shadow-pj);isolation:isolate}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-120px;background:radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 70%);z-index:-1}
.hero::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;left:-70px;bottom:-120px;background:radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,0) 70%);z-index:-1}
.hero .lbl{font-size:13px;color:var(--hero-sub);font-weight:600}
.hero .num{font-weight:800;font-size:44px;letter-spacing:-.045em;line-height:1.05;margin:6px 0 4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .num.neg{color:var(--hero-neg)}
.hero .hint{margin:0 0 16px;color:var(--hero-sub);font-size:13.5px}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:16px;border-top:1px solid rgba(255,255,255,.22)}
.legend div{min-width:0}
.legend b{display:block;font-size:15px;font-weight:700;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.legend span{display:block;font-size:12px;color:var(--hero-sub);margin-bottom:2px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink2);font-size:13px}
.note{margin:12px 0 0;font-size:13px;color:var(--ink2)}
.btn{border:0;background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 70%, var(--accent-2)));color:var(--accent-ink);font-weight:700;border-radius:14px;padding:12px 18px;min-height:46px;box-shadow:0 8px 18px -10px color-mix(in srgb, var(--accent) 80%, transparent)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.small{padding:8px 14px;min-height:38px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--soft);color:var(--ink2)}
.tag{font-size:11px;font-weight:700;background:var(--soft);color:var(--ink2);padding:2px 8px;border-radius:99px;white-space:nowrap}
/* barra de abas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px));pointer-events:none}
.nav-in{pointer-events:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:520px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
.nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;color:var(--ink2);font-size:11.5px;font-weight:600;min-height:52px}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;background:var(--bad);color:var(--on-bad);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.badge.off{display:none}
/* mês e filtros */
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
.monthbar strong{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.monthbar strong::first-letter{text-transform:uppercase}
.monthbar button{width:38px;height:38px;border-radius:12px;border:0;background:var(--soft);font-size:18px;line-height:1;display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* campos */
.field{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:12.5px;color:var(--ink2);font-weight:600;min-width:0}
.field input,.field select{border:1.5px solid transparent;background:var(--soft);border-radius:14px;padding:11px 13px;min-height:46px;font-weight:600;color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.mat .field input,.mat .field select,.stk .field input,.stk .field select{background:var(--surface)}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.field input::placeholder{color:var(--ink2);opacity:.6;font-weight:500}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{background:var(--soft);border-radius:16px;padding:12px 14px;min-width:0}
.mini span{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.mini b{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.two.out{margin-top:14px}
.bar{position:relative;height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn-bar)} .bar.bad>i{background:var(--bad)}
.inc{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:600;min-height:32px}
.inc input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.x{background:none;border:0;color:var(--ink2);font-size:13px;font-weight:600;padding:6px 2px;white-space:nowrap}
.x.sure{color:var(--bad)}
.listc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:14px;align-items:start}
.listc>.empty{grid-column:1/-1}
.mat-h{display:flex;align-items:center;gap:8px}
.mat-h .nm{flex:1;min-width:0;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;margin-left:-8px;font-weight:700;font-size:16px}
.mat-h .nm:focus{border-color:var(--accent);background:var(--surface);outline:none}
.mat-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.cp{text-align:right}
.cp span{display:block;font-size:12px;color:var(--ink2);font-weight:600}
.cp b{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.more{margin-top:10px}
.mat .two,.stk .two,.buy .two{align-items:end}
.help{margin:10px 0 0;font-size:12.5px;color:var(--ink2);font-weight:500}
.help:empty{display:none}
.more summary{font-size:12.5px;font-weight:700;color:var(--accent);cursor:pointer;min-height:32px;display:flex;align-items:center}
/* materiais */
.mat{background:var(--soft);border-radius:18px;padding:14px;min-width:0;border-left:4px solid var(--col)}
.mat.off .cp{opacity:.55}
.add{margin-top:12px}
.pie{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px}
.pie svg{width:min(230px,76%);height:auto;display:block}
.slice{stroke:var(--surface);stroke-width:2;stroke-linejoin:round}
.dn{font-family:var(--font);font-weight:800;fill:var(--ink)}
.dn2{font-family:var(--font);font-weight:600;fill:var(--ink2)}
.lgl{width:100%;display:flex;flex-direction:column;gap:2px}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto 3.6em;gap:10px;align-items:center;padding:9px 6px;min-height:42px}
.lg i{display:block;width:12px;height:12px;border-radius:4px;background:var(--col)}
.lg .n{min-width:0;overflow-wrap:anywhere;font-weight:500}
.lg .v{font-weight:700;font-variant-numeric:tabular-nums}
.lg .p{color:var(--ink2);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:22px 8px;text-align:center;color:var(--ink2);font-size:14px}
/* estoque */
.stk{background:var(--soft);border-radius:18px;padding:14px;min-width:0;border-left:4px solid var(--col)}
.stk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stk-h .n{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
.stk-q{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;align-items:end;margin-top:4px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center;margin-top:6px}
.step button{height:46px;border-radius:14px;border:0;background:var(--surface);font-size:20px;font-weight:700;line-height:1}
.step input{border:1.5px solid transparent;background:var(--surface);border-radius:14px;padding:11px 8px;min-height:46px;font-weight:700;text-align:center;width:100%;font-variant-numeric:tabular-nums}
.step input:focus{border-color:var(--accent);outline:none}
.stk-m{margin-top:12px}
.stk-m .t{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.stk-m .t b{color:var(--ink);font-variant-numeric:tabular-nums}
.stk-a{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.buy{margin-top:10px;background:var(--surface);border-radius:16px;padding:4px 12px 12px}
.shop{display:flex;flex-direction:column}
.shop .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.shop .it:first-child{border-top:0}
.shop .it b{font-variant-numeric:tabular-nums;white-space:nowrap}
.shop .it .s{grid-column:1/-1;font-size:12.5px;color:var(--ink2)}
/* serviços */
.uso-h{margin:14px 0 6px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.uso{display:flex;flex-wrap:wrap;gap:6px}
.uso .chip{padding:6px 11px;font-size:12.5px}
.sug{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;background:var(--soft);border-radius:16px;padding:12px 14px}
.sug .tx{font-size:13px;color:var(--ink2);min-width:0}
.sug .tx b{color:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
/* em breve */
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 22px}
.soon svg{width:44px;height:44px;stroke:var(--accent,#2563eb);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.soon h2{margin:0;font-size:20px}
.soon p{margin:0;max-width:38ch;color:var(--ink2);font-size:14.5px}
.soon .pill{margin-top:4px}
/* pedidos */
.ord .sv{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.ord .sv b{color:var(--ink);font-variant-numeric:tabular-nums}
.ord-a{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:14px}
/* painel */
.row-i{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:14px;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.row-i:first-child{border-top:0}
.ul{margin:8px 0 0;padding:0;list-style:none}
.ul li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ul li:first-child{border-top:0}
.rk{padding:10px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk-h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.rk-h b{font-variant-numeric:tabular-nums;white-space:nowrap}
.rk .muted{display:block;margin-top:4px;font-size:12.5px}
.big{font-weight:800;font-size:22px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.formula{font-size:12.5px;color:var(--ink2);text-align:center;margin:18px 0 0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:99px;box-shadow:var(--shadow);z-index:6;max-width:calc(100% - 32px);text-align:center}
@media (max-width:420px){
  .hero .num{font-size:38px}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
/* tablet: 2 colunas, barra de abas continua embaixo */
@media (min-width:720px){
  .app{max-width:880px;padding-inline:24px;padding-block:28px 130px}
  .top .mark{font-size:26px}
  .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .stack>.hero,.stack>.monthbar,.stack>.chips,.stack>.note,.stack>.wide,.stack>.btn{grid-column:1/-1}
  .monthbar{max-width:440px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;grid-column:1/-1}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .chips{flex-wrap:wrap;overflow:visible}
  .hero{padding:28px 28px 24px}
  .hero .num{font-size:52px}
  .card{padding:22px}
  .nav-in{max-width:620px}
  .shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
  .shop .it:nth-child(2){border-top:0}
  .pie{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px 32px}
  .pie svg{width:240px}
  .pie .lgl{flex:1 1 280px;max-width:420px}
  .nform{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:12px;align-items:end}
  .nform .two{display:contents}
  .nform label[for="n-cli"]{grid-column:span 4}
  .nform label[for="n-s"]{grid-column:span 4}
  .nform label[for="n-q"]{grid-column:span 2}
  .nform label[for="n-d"]{grid-column:span 2}
  .nform label[for="n-v"]{grid-column:span 4}
  .nform>.btn{grid-column:span 4;margin-top:0!important}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom, 0px))}
}
/* computador: menu lateral fixo */
@media (min-width:1024px){

(function(){

function num(s){
  if(s==null) return NaN;
  var t=String(s).trim().replace(/[R$\s%]/g,'');
  if(!t) return NaN;
  if(t.indexOf(',')>-1) t=t.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');
  var n=Number(t);
  return isFinite(n)?n:NaN;
}
function nz(s){var n=num(s);return isNaN(n)?0:n;}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
function p2(n){return n<10?'0'+n:''+n;}
function fmtISO(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function parseISO(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3],12,0,0):null;}
function addDays(iso,n){var d=parseISO(iso)||new Date();d.setDate(d.getDate()+n);return fmtISO(d);}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function cpOf(m){var cu=num(m.custo),re=num(m.rend);return (cu>=0&&re>0)?cu/re:null;}
function findIn(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id) return arr[i];}return null;}

/* materiais que um serviço consome: base (entra em toda limpeza) + os extras marcados */
function usedMats(S,s){
  var uso=(s&&s.uso)||[], base=s?s.base!==false:true;
  return S.mat.filter(function(m){return (base&&m.inc)||uso.indexOf(m.id)>-1;});
}
function srvCalc(S,s){
  var ms=usedMats(S,s),mat=0,miss=0;
  ms.forEach(function(m){var c=cpOf(m);if(c===null)miss++;else mat+=c;});
  var cfg=S.cfg,extra=nz(cfg.extra),taxa=nz(cfg.taxa)/100,alvo=nz(cfg.margem)/100,hora=nz(cfg.hora);
  var preco=nz(s.preco),horas=nz(s.min)/60;
  var tx=taxa*preco,custo=mat+extra+tx,lucro=preco-custo;
  var margem=preco>0?lucro/preco:null,lph=horas>0?lucro/horas:null;
  var base=mat+extra,cand=[];
  if(1-taxa-alvo>0.0001) cand.push(base/(1-taxa-alvo));
  if(hora>0&&horas>0&&taxa<1) cand.push((hora*horas+base)/(1-taxa));
  var sug=cand.length?Math.ceil(Math.max.apply(null,cand)-1e-9):null;
  return {mat:mat,miss:miss,extra:extra,tx:tx,custo:custo,lucro:lucro,margem:margem,lph:lph,sug:sug,preco:preco,cm:mat+extra};
}
function baseCalc(S){
  var total=0,miss=0,top=null,used=[];
  S.mat.forEach(function(m){
    if(!m.inc) return;
    var c=cpOf(m);
    if(c===null){miss++;return;}
    total+=c;used.push({m:m,cp:c});
    if(!top||c>top.cp) top={m:m,cp:c};
  });
  return {total:total,miss:miss,top:top,used:used};
}
function mixW(S,today){
  var w={},tot=0,cut=addDays(today,-90),out={},t2=0;
  S.ped.forEach(function(o){
    if(o.x||!o.s||o.cr&&o.cr<cut) return;
    var q=nz(o.q);
    if(q>0){w[o.s]=(w[o.s]||0)+q;tot+=q;}
  });
  S.srv.forEach(function(s){if(w[s.id]){out[s.id]=w[s.id];t2+=w[s.id];}});
  if(t2<=0){S.srv.forEach(function(s){out[s.id]=1;});t2=S.srv.length;}
  Object.keys(out).forEach(function(k){out[k]=out[k]/t2;});
  return out;
}
function mixAvg(S,w){
  var ticket=0,custo=0;
  S.srv.forEach(function(s){
    var f=w[s.id]||0;if(!f) return;
    var c=srvCalc(S,s);ticket+=f*c.preco;custo+=f*c.custo;
  });
  return {ticket:ticket,custo:custo,lucro:ticket-custo};
}
function stockInfo(S,m,w){
  var est=num(m.est),min=num(m.min),lead=num(m.lead),rend=num(m.rend),cfg=S.cfg;
  if(isNaN(lead)) lead=3;
  var parDia=nz(cfg.pares)/30,share=0;
  if(S.srv.length){S.srv.forEach(function(s){if((w[s.id]||0)&&usedMats(S,s).some(function(x){return x.id===m.id;})) share+=w[s.id];});}
  else share=m.inc?1:0;
  var unDia=(rend>0)?parDia*share/rend:0;
  var cob=(!isNaN(est)&&unDia>0)?est/unDia:null;
  var effAuto=unDia*(lead+3);
  var sug=unDia>0?Math.ceil(effAuto-1e-9):null;
  var eff=min>0?min:effAuto;
  var dias=nz(cfg.dias)||30;
  var alvo=unDia>0?Math.ceil(unDia*dias-1e-9):0;
  var st;
  if(isNaN(est)) st='sem';
  else if(est<=0) st='zero';
  else if(eff>0&&est<=eff) st='repor';
  else if(cob!==null&&cob>EXC) st='parado';
  else st='ok';
  var comprar=0;
  if(st==='zero'||st==='repor') comprar=Math.max(1,Math.ceil(Math.max(alvo,eff)-(isNaN(est)?0:est)-1e-9));
  var cu=nz(m.custo);
  return {est:isNaN(est)?null:est,eff:eff,sug:sug,cob:cob,unDia:unDia,status:st,comprar:comprar,valor:(isNaN(est)?0:est)*cu,pares:(isNaN(est)||!(rend>0))?null:est*rend,gasto:comprar*cu};
}
function consumeFor(S,o){
  var s=findIn(S.srv,o.s),q=nz(o.q),out=[];
  if(!s||!(q>0)) return out;
  usedMats(S,s).forEach(function(m){
    var re=num(m.rend),es=num(m.est);
    if(!(re>0)||isNaN(es)) return;
    var u=q/re;
    m.est=String(Math.max(0,Math.round((es-u)*10000)/10000)).replace('.',',');
    out.push({nome:m.nome,u:u});
  });
  return out;
}
function setStatus(S,o,st,today){
  var i0=STAT.indexOf(o.st),i1=STAT.indexOf(st),used=[];
  if(i1<0) return used;
  if(i1>=1&&!o.baixa){
    if(S.cfg.baixa!==false) used=consumeFor(S,o);
    o.baixa=true;
  }
  if(i1===4) o.ent=today;
  else if(i0===4) o.ent='';
  o.st=st;
  return used;
}
function pedLucro(S,o){
  var v=nz(o.valor);
  return v-nz(o.cm)-nz(S.cfg.taxa)/100*v;
}
function monthStats(S,ym){
  var rec=0,cus=0,par=0,n=0;
  S.ped.forEach(function(o){
    if(o.st==='entregue'&&String(o.ent||'').slice(0,7)===ym){
      var v=nz(o.valor);rec+=v;cus+=nz(o.cm)+nz(S.cfg.taxa)/100*v;par+=nz(o.q);n++;
    }
  });
  var fix=nz(S.cfg.fixas);
  return {rec:rec,cus:cus,par:par,n:n,fix:fix,bruto:rec-cus,lucro:rec-cus-fix};
}

/* dados iniciais e migração do formato antigo */
function defaultCfg(){return {pares:'90',fixas:'80',extra:'1,50',taxa:'2',margem:'60',hora:'25',dias:'30',baixa:true};}
function seedMat(r,i){
  return {id:'k_'+r[0],k:r[0],c:i%8,nome:r[1],cats:legacyCats({k:r[0],cat:r[2]}),outra:'',un:r[3],qemb:r[10]||'',custo:r[4],rend:r[5],inc:!!r[6],est:r[7],min:r[8],lead:r[9],forn:'',x:true,xe:true};
}
function seedSrv(r){
  return {id:'sv_'+r[0],nome:r[1],preco:r[2],min:r[3],base:!!r[4],ukeys:r[5],uso:[],x:true};
}
function resolveUso(S){
  var map={};
  S.mat.forEach(function(m){if(m.k) map[m.k]=m.id;});
  S.srv.forEach(function(s){
    if(s.ukeys){s.uso=s.ukeys.map(function(k){return map[k];}).filter(Boolean);delete s.ukeys;}
  });
}
function seedPed(S,today){
  var first=today.slice(0,7)+'-01';
  function later(d){return d<first?first:d;}
  var rows=[
    ['Marina S.','completa',1,addDays(today,1),'secando','55',''],
    ['João P.','simples',2,addDays(today,-1),'limpeza','70',''],
    ['Loja Pé Leve','sola',3,addDays(today,2),'recebido','130',''],
    ['Camila R.','camurca',1,addDays(today,3),'recebido','65',''],
    ['Bruno L.','simples',1,addDays(today,-3),'entregue','35',later(addDays(today,-2))],
    ['Ana C.','completa',2,addDays(today,-5),'entregue','110',later(addDays(today,-4))],
    ['Rafael M.','imperm',1,addDays(today,-1),'entregue','30',later(addDays(today,-1))]
  ];
  return rows.map(function(r,i){
    var s=findIn(S.srv,'sv_'+r[1]),c=s?srvCalc(S,s):{cm:0},q=r[2];
    return {id:'po_'+i,cli:r[0],s:s?s.id:'',q:String(q),prazo:r[3],st:r[4],valor:r[5],cm:(c.cm*q).toFixed(4),baixa:r[4]!=='recebido',ent:r[6],cr:addDays(r[3],-3),x:true};
  });
}
function buildSeed(today){
  var S={v:2,mat:CAT.map(seedMat),srv:SRV.map(seedSrv),ped:[],cfg:defaultCfg()};
  resolveUso(S);
  S.ped=seedPed(S,today);
  return S;
}
function migrate(o,today){
  var S=buildSeed(today),seeds={};
  S.mat.forEach(function(sm){seeds[norm(sm.nome)]=sm;});
  var used={},mats=[];
  (o.mat||[]).forEach(function(m,i){
    if(!m||typeof m!=='object') return;
    var sm=seeds[norm(m.nome)];
    var base={id:String(m.id||uid('m')),c:((+m.c)||0)%8,nome:String(m.nome||'').slice(0,60),custo:String(m.custo==null?'':m.custo).slice(0,14),rend:String(m.rend==null?'':m.rend).slice(0,10),inc:m.inc!==false,x:false,forn:''};
    if(sm&&!used[sm.k]){
      used[sm.k]=true;
      base.k=sm.k;base.cats=sm.cats.slice();base.outra='';base.un=sm.un;base.qemb=sm.qemb;base.est=sm.est;base.min=sm.min;base.lead=sm.lead;base.xe=true;
    }else{
      base.k='';base.cats=['limpeza'];base.outra='';base.un='un';base.qemb='';base.est='';base.min='';base.lead='3';base.xe=false;
    }
    mats.push(base);
  });
  S.mat.forEach(function(sm){if(!used[sm.k]) mats.push(sm);});
  mats.forEach(function(m,i){m.c=i%8;});
  var fresh=buildSeed(today);
  S.mat=mats;
  S.srv=fresh.srv;S.ped=[];
  resolveUso(S);
  S.ped=seedPed(S,today);
  if(o.pares!=null&&String(o.pares)) S.cfg.pares=String(o.pares).slice(0,10);
  if(o.fixas!=null&&String(o.fixas)) S.cfg.fixas=String(o.fixas).slice(0,14);
  return S;
}
function str(v,n){return String(v==null?'':v).slice(0,n);}
function sanitize(o,today){
  if(!o||typeof o!=='object') return buildSeed(today);
  if(!(o.v>=2)){
    if(Array.isArray(o.mat)) return migrate(o,today);
    return buildSeed(today);
  }
  var d=defaultCfg(),c=o.cfg||{};
  var S={v:2,cfg:{
    pares:str(c.pares==null?d.pares:c.pares,10),fixas:str(c.fixas==null?d.fixas:c.fixas,14),extra:str(c.extra==null?d.extra:c.extra,10),
    taxa:str(c.taxa==null?d.taxa:c.taxa,6),margem:str(c.margem==null?d.margem:c.margem,6),hora:str(c.hora==null?d.hora:c.hora,10),
    dias:str(c.dias==null?d.dias:c.dias,4),baixa:c.baixa!==false
  }};
  S.mat=(Array.isArray(o.mat)?o.mat:[]).filter(function(m){return m&&typeof m==='object';}).slice(0,80).map(function(m,i){
    return {id:str(m.id||uid('m'),40),k:str(m.k,20),c:((+m.c)||0)%8,nome:str(m.nome,60),cats:Array.isArray(m.cats)?m.cats.map(function(c){return str(c,12);}).filter(catKey).slice(0,6):legacyCats(m),outra:str(m.outra,30),un:str(m.un,10),qemb:str(m.qemb,10),custo:str(m.custo,14),rend:str(m.rend,10),inc:m.inc!==false,est:str(m.est,12),min:str(m.min,10),lead:str(m.lead,4),forn:str(m.forn,60),x:!!m.x,xe:!!m.xe};
  });
  S.srv=(Array.isArray(o.srv)?o.srv:[]).filter(function(s){return s&&typeof s==='object';}).slice(0,40).map(function(s){
    return {id:str(s.id||uid('sv'),40),nome:str(s.nome,60),preco:str(s.preco,14),min:str(s.min,6),base:s.base!==false,uso:(Array.isArray(s.uso)?s.uso:[]).map(function(u){return str(u,40);}).slice(0,80),x:!!s.x};
  });
  S.ped=(Array.isArray(o.ped)?o.ped:[]).filter(function(p){return p&&typeof p==='object';}).slice(-400).map(function(p){
    return {id:str(p.id||uid('po'),40),cli:str(p.cli,60),s:str(p.s,40),q:str(p.q,6),prazo:str(p.prazo,10),st:STAT.indexOf(p.st)>-1?p.st:'recebido',valor:str(p.valor,14),cm:str(p.cm,16),baixa:!!p.baixa,ent:str(p.ent,10),cr:str(p.cr,10),x:!!p.x};
  });
  return S;
}
/*ENDPURE*/

function findMat(id){return findIn(S.mat,id);}
function findSrv(id){return findIn(S.srv,id);}
function findPed(id){return findIn(S.ped,id);}
function catLabel(k){for(var i=0;i<CATS.length;i++){if(CATS[i][0]===k) return CATS[i][1];}return 'Outra';}
var UNITS=[['L','Litros (L)'],['mL','Mililitros (mL)'],['kit','Kit'],['kg','Quilo (kg)'],['g','Gramas (g)'],['un','Unidade'],['pct','Pacote'],['frasco','Frasco'],['tubo','Tubo'],['rolo','Rolo'],['cx','Caixa'],['par','Par']];
var fmtDec3=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3});
var fmtBRL4=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:4});
function unitOptions(sel){
  var found=false,o=UNITS.map(function(u){if(u[0]===sel) found=true;return '<option value="'+u[0]+'"'+(u[0]===sel?' selected':'')+'>'+u[1]+'</option>';}).join('');
  if(sel&&!found) o+='<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>';
  return o;
}
function unitName(u){return u==='L'?'litro':(u||'un');}
function pkgLabel(m){var q=num(m.qemb),u=m.un||'un';return q>0?fmtDec.format(q)+' '+u:u;}
function buyLabel(m,n){var q=num(m.qemb),u=m.un||'un';return q>0?fmtDec.format(n)+' × '+fmtDec.format(q)+' '+u:fmtDec.format(n)+' '+u;}
function stockUnit(m){return num(m.qemb)>0?'embalagens de '+pkgLabel(m):(m.un||'un');}
function helpText(m){
  var q=num(m.qemb),cu=num(m.custo),re=num(m.rend),u=m.un||'un',p=[];
  if(!(q>0)) return '';
  p.push('Embalagem de '+fmtDec.format(q)+' '+u);
  if(cu>=0){
    p.push(fmtBRL4.format(cu/q)+' por '+unitName(u));
    if(u==='mL') p.push(brl(cu/q*1000)+' por litro');
  }
  if(re>0) p.push('usa '+fmtDec3.format(q/re)+' '+u+' por par');
  return p.join(' · ');
}
function fld(id,label,val,extra){
  return '<label class="field" for="'+id+'"><span>'+label+'</span><input id="'+id+'" '+(extra||'')+' value="'+esc(val)+'" autocomplete="off"></label>';
}

/* ---------- contexto com todas as contas ---------- */
function ctx(){
  var w=mixW(S,TODAY),avg=mixAvg(S,w);
  var st=S.mat.map(function(m){return {m:m,i:stockInfo(S,m,w)};});
  var rep=st.filter(function(r){return r.i.status==='zero'||r.i.status==='repor';});
  var parados=st.filter(function(r){return r.i.status==='parado';});
  var late=S.ped.filter(function(o){return o.st!=='entregue'&&o.prazo&&o.prazo<TODAY;});
  var open=S.ped.filter(function(o){return o.st!=='entregue';});
  var sc={};S.srv.forEach(function(s){sc[s.id]=srvCalc(S,s);});
  return {w:w,avg:avg,st:st,rep:rep,parados:parados,late:late,open:open,sc:sc,base:baseCalc(S)};
}

/* ---------- visões ---------- */
function bannerHtml(){
  var t=V.tab,nx=S.mat.filter(function(m){return m.x;}).length,ne=S.mat.filter(function(m){return m.xe;}).length,
      ns=S.srv.filter(function(s){return s.x;}).length,np=S.ped.filter(function(o){return o.x;}).length;
  var msg='',scope='',lbl='Limpar exemplos';
  if(t==='painel'&&(nx||ne||ns||(PED_ON&&np))){msg='Parte dos números são exemplos de referência: preços, estoque e serviços'+(PED_ON?' e pedidos':'')+'.';scope='all';}
  else if(t==='materiais'&&nx){msg=plural(nx,'material está','materiais estão')+' com custo e rendimento de exemplo. Troque pelos seus.';scope='mat';}
  else if(t==='estoque'&&ne){msg='As quantidades de estoque são exemplos. Faça a contagem real.';scope='stk';lbl='Zerar contagem';}
  else if(t==='servicos'&&ns){msg='Os serviços, preços e tempos são exemplos. Ajuste ao que você cobra.';scope='srv';lbl='Apagar exemplos';}
  else if(PED_ON&&t==='pedidos'&&np){msg='Os pedidos abaixo são exemplos para mostrar o fluxo.';scope='ped';lbl='Apagar exemplos';}
  return msg?'<span>'+esc(msg)+'</span><button type="button" data-act="clear" data-scope="'+scope+'">'+lbl+'</button>':'';
}
function navHtml(){

  }).join('');
}

function fillPainel(C,O,W,K,H){
  var dt=parseISO(V.ym+'-01')||new Date(),isNow=V.ym===TODAY.slice(0,7);
  var ms=monthStats(S,V.ym);
  O['p.mlabel']=dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  O['p.lbl']='Lucro de '+dt.toLocaleDateString('pt-BR',{month:'long'});
  O['p.lucro']=brl(ms.lucro);K['p.lucroC']='num'+(ms.lucro<0?' neg':'');
  O['p.hint']=ms.n?plural(ms.n,'pedido entregue','pedidos entregues')+' · '+plural(ms.par,'par','pares')+'. Lucro = recebido − custo dos pedidos − despesas fixas.':(PED_ON?'Nenhum pedido entregue neste mês. Marque pedidos como entregues na aba Pedidos.':'O registro de pedidos chega em breve. Por enquanto o lucro mostra só as despesas fixas.');
  O['p.rec']=brl(ms.rec);O['p.cus']=brl(ms.cus);O['p.fix']=brl(ms.fix);
  var meta=nz(S.cfg.pares),lpar=C.avg.lucro,eqv=(ms.fix>0&&lpar>0)?Math.ceil(ms.fix/lpar-1e-9):(ms.fix>0?null:0);
  O['m.par']=fmtInt.format(ms.par)+' de '+fmtInt.format(meta)+' pares';
  W['m.w']=meta>0?Math.min(100,Math.max(ms.par>0?2:0,ms.par/meta*100)):0;
  var pill='',pc='pill mute',bc='bar';
  if(eqv!==null&&eqv>0){
    if(ms.par>=eqv){pill='Acima do equilíbrio';pc='pill good';bc='bar good';}
    else{pill='Faltam '+fmtInt.format(eqv-ms.par)+' pares para empatar';pc='pill warn';bc='bar warn';}
  }else if(eqv===0){pill='Sem despesas fixas';}
  else{pill='Sem lucro por par';pc='pill bad';bc='bar bad';}
  O['m.pill']=pill;K['m.pillC']=pc;K['m.barC']=bc;
  O['m.ticket']=brl(C.avg.ticket);O['m.lpar']=brl(lpar);
  O['m.eq']=eqv===null?'—':fmtInt.format(eqv)+' pares';
  O['m.proj']=brl(meta*lpar-ms.fix);
  /* alertas */
  var al=[];
  if(C.rep.length) al.push(['bad','estoque',plural(C.rep.length,'item para repor','itens para repor'),C.rep.slice(0,3).map(function(r){return r.m.nome;}).join(', ')+(C.rep.length>3?'…':'')]);
  if(PED_ON&&C.late.length) al.push(['bad','pedidos',plural(C.late.length,'pedido atrasado','pedidos atrasados'),C.late.slice(0,3).map(function(o){return o.cli||'Sem nome';}).join(', ')]);
  var low=S.srv.filter(function(s){var c=C.sc[s.id];return c.sug!==null&&nz(s.preco)<c.sug;});
  if(low.length) al.push(['warn','servicos',plural(low.length,'serviço abaixo da meta','serviços abaixo da meta'),'Veja o preço sugerido em cada um.']);
  var pv=C.parados.reduce(function(a,r){return a+r.i.valor;},0);
  if(C.parados.length) al.push(['mute','estoque',brl(pv)+' parados em estoque',plural(C.parados.length,'item dura','itens duram')+' mais de '+EXC+' dias. Evite comprar mais.']);
  var miss=C.base.miss;
  if(miss) al.push(['mute','materiais',plural(miss,'material sem custo ou rendimento','materiais sem custo ou rendimento'),'As contas ficam incompletas até preencher.']);
  H['p.alerts']=al.length?al.map(function(a){
    var lab=a[0]==='bad'?'Urgente':a[0]==='warn'?'Ajustar':'Ver';
    return '<button type="button" class="row-i" data-act="go" data-tab="'+a[1]+'"><span class="pill '+a[0]+'">'+lab+'</span><span><b>'+esc(a[2])+'</b><br><span class="muted">'+esc(a[3])+'</span></span></button>';
  }).join(''):'<div class="empty">Tudo em ordem. Nada pedindo atenção.</div>';
  /* insights */
  var ins=[],rows=S.srv.map(function(s){return {s:s,c:C.sc[s.id]};}).filter(function(r){return r.c.lph!==null;});
  if(rows.length>1){
    var best=rows.slice().sort(function(a,b){return b.c.lph-a.c.lph;})[0];
    ins.push('<b>'+esc(best.s.nome)+'</b> é o serviço que mais rende por hora: '+brl(best.c.lph)+'. Vale oferecer primeiro.');
  }
  var adj=S.srv.filter(function(s){var c=C.sc[s.id];return c.sug!==null&&nz(s.preco)<c.sug;}).slice(0,3);
  adj.forEach(function(s){ins.push('Reajuste <b>'+esc(s.nome)+'</b> de '+brl(nz(s.preco))+' para '+brl(C.sc[s.id].sug)+' para chegar à margem alvo e ao seu valor por hora.');});
  if(C.base.top&&C.base.total>0) ins.push('<b>'+esc(C.base.top.m.nome)+'</b> pesa '+fmtPct.format(C.base.top.cp/C.base.total)+' do material base ('+brl(C.base.top.cp)+' por par). Compare fornecedores ou compre em maior quantidade.');
  if(C.parados.length) ins.push('Há '+brl(pv)+' parados em itens que duram mais de '+EXC+' dias. Segure novas compras deles.');
  if(C.rep.length) ins.push('Repor '+plural(C.rep.length,'item','itens')+' custa cerca de '+brl(C.rep.reduce(function(a,r){return a+r.i.gasto;},0))+'. A lista está na aba Estoque.');
  H['p.ins']=ins.length?ins.map(function(t){return '<li>'+t+'</li>';}).join(''):'<li class="muted">Cadastre serviços e materiais para ver sugestões.</li>';
  /* barras */
  var bars=S.srv.map(function(s){return {s:s,c:C.sc[s.id]};}).sort(function(a,b){return b.c.lucro-a.c.lucro;});
  var mx=bars.reduce(function(a,r){return Math.max(a,r.c.lucro);},0);
  H['p.bars']=bars.length?bars.map(function(r){
    var pc=(mx>0&&r.c.lucro>0)?r.c.lucro/mx*100:0;
    return '<div class="rk"><div class="rk-h"><span>'+esc(r.s.nome||'Sem nome')+'</span><b>'+brl(r.c.lucro)+'</b></div><div class="bar"><i style="width:'+pc.toFixed(1)+'%"></i></div>'
      +'<span class="muted">'+(r.c.lph!==null?brl(r.c.lph)+' por hora · ':'')+(r.c.margem!==null?'margem '+fmtPct.format(r.c.margem):'sem preço')+'</span></div>';
  }).join(''):'<div class="empty">Nenhum serviço cadastrado.</div>';
}

/* Materiais */
function pieHtml(b){
  var used=b.used.filter(function(r){return r.cp>0;}).slice().sort(function(a,c){return c.cp-a.cp;});
  function arc(cx,cy,R,r,a0,a1){
    var large=(a1-a0)>Math.PI?1:0;
    function p(rad,a){return [(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];}
    var A=p(R,a0),B=p(R,a1),Cc=p(r,a1),D=p(r,a0);
    return 'M'+A[0]+' '+A[1]+'A'+R+' '+R+' 0 '+large+' 1 '+B[0]+' '+B[1]+'L'+Cc[0]+' '+Cc[1]+'A'+r+' '+r+' 0 '+large+' 0 '+D[0]+' '+D[1]+'Z';
  }
  function ring(cx,cy,R,r){
    return 'M'+(cx-R)+' '+cy+'a'+R+' '+R+' 0 1 0 '+(2*R)+' 0a'+R+' '+R+' 0 1 0 '+(-2*R)+' 0Z'+'M'+(cx-r)+' '+cy+'a'+r+' '+r+' 0 1 0 '+(2*r)+' 0a'+r+' '+r+' 0 1 0 '+(-2*r)+' 0Z';
  }
  if(!used.length||b.total<=0){
    return '<svg viewBox="0 0 200 200" role="img" aria-label="Sem dados"><path d="'+ring(100,100,90,56)+'" fill="var(--track)" fill-rule="evenodd"/><text class="dn" x="100" y="106" text-anchor="middle" font-size="22">—</text></svg><div class="empty">Preencha custo e rendimento para ver a divisão.</div>';
  }
  var svg='<svg viewBox="0 0 200 200" role="img" aria-label="Divisão do custo base por par entre os materiais">';
  if(used.length===1) svg+='<path class="slice" d="'+ring(100,100,90,56)+'" fill-rule="evenodd" style="fill:var(--c'+used[0].m.c+')"/>';
  else{
    var a=-Math.PI/2;
    used.forEach(function(r){var sw=r.cp/b.total*2*Math.PI;svg+='<path class="slice" d="'+arc(100,100,90,56,a,a+sw)+'" style="fill:var(--c'+r.m.c+')"/>';a+=sw;});
  }
  svg+='<text class="dn" x="100" y="102" text-anchor="middle" font-size="21">'+esc(fmtBRL.format(b.total))+'</text><text class="dn2" x="100" y="120" text-anchor="middle" font-size="11">por par</text></svg>';
  return svg+'<div class="lgl">'+used.map(function(r){
    return '<div class="lg" style="--col:var(--c'+r.m.c+')"><i></i><span class="n">'+esc(r.m.nome||'Sem nome')+'</span><span class="v">'+esc(fmtBRL.format(r.cp))+'</span><span class="p">'+esc(fmtPct.format(r.cp/b.total))+'</span></div>';
  }).join('')+'</div>';
}

  $$('[data-w]').forEach(function(el){var k=el.dataset.w;if(k in W) el.style.width=W[k].toFixed(1)+'%';});
  $$('[data-c]').forEach(function(el){var k=el.dataset.c;if(k in K) el.className=K[k];});
  $$('[data-h]').forEach(function(el){var k=el.dataset.h;if(k in H&&el.__h!==H[k]){el.innerHTML=H[k];el.__h=H[k];}});
  var b=bannerHtml();
  if(b!==lastBanner){$('banner').innerHTML=b;lastBanner=b;}
}
function syncInputs(){
  $$('[data-g]').forEach(function(el){
    var k=el.dataset.g;
    if(el.type==='checkbox') el.checked=S.cfg[k]!==false;
    else el.value=S.cfg[k]==null?'':S.cfg[k];
  });
}
function render(){
  $('view').innerHTML=VIEWS[V.tab][0]();
  $('nav').innerHTML=navHtml();
  syncInputs();
  lastBanner='\u0000';
  paint();
}
function goTab(t){
  V.tab=t;V.newId=null;
  try{localStorage.setItem(TABKEY,t);}catch(e){}
  render();
  window.scrollTo(0,0);
}

/* ---------- salvar ---------- */
var docRef=null,timer=null,writing=false,again=false,loaded=false;
function status(t){var el=$('st');if(el) el.textContent=t||'';}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function flush(){
  var okLocal=persistLocal();
  if(!docRef){status(okLocal?'Salvo neste aparelho':'Não foi possível salvar');return;}
  if(writing){again=true;return;}
  writing=true;
  var snap=JSON.parse(JSON.stringify(S));
  docRef.set({estado:snap}).then(function(){status('Salvo');}).catch(function(){status(okLocal?'Salvo neste aparelho':'Não foi possível salvar');}).then(function(){
    writing=false;
    if(again){again=false;flush();}
  });
}
function save(){dirty=true;clearTimeout(timer);timer=setTimeout(flush,600);}
function connectDb(){
  if(!window.claude||typeof window.claude.use!=='function') return;
  window.claude.use('db').then(function(d){
    if(!d) return;
    docRef=d.doc('app/estado');
    docRef.onSnapshot(function(snap){
      if(loaded) return;
      if(!snap.exists&&snap.metadata&&snap.metadata.fromCache) return;
      loaded=true;
      if(snap.exists&&!dirty){
        var data=snap.data();
        if(data&&data.estado){S=sanitize(data.estado,TODAY);render();}
      }
    },function(){});
  }).catch(function(){});
}

/* ---------- eventos ---------- */
var toastTimer=null;
function toast(t){var el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true;},2600);}
function copyText(t){
  try{navigator.clipboard.writeText(t).then(function(){toast('Copiado');},function(){toast('Não foi possível copiar');});}
  catch(e){toast('Não foi possível copiar');}
}
function edit(){paint();save();}
var view=$('view');
function onField(e){
  var t=e.target,g=t.dataset.g,f=t.dataset.f;
  if(g){S.cfg[g]=t.type==='checkbox'?t.checked:t.value;edit();return;}
  if(t.id==='n-s'||t.id==='n-q'){updNewVal();return;}
  if(t.id==='n-v'){V.nvT=true;return;}
  if(!f) return;
  var row=t.closest('[data-id]');if(!row) return;
  var kind=row.dataset.kind,id=row.dataset.id;
  var it=kind==='mat'?findMat(id):kind==='srv'?findSrv(id):findPed(id);
  if(!it) return;
  it[f]=t.type==='checkbox'?t.checked:t.value;
  if(kind==='mat'){
    if(f==='custo'||f==='rend') it.x=false;
    if(f==='est'||f==='min') it.xe=false;
    if(f==='inc'){row.classList.toggle('off',!t.checked);}
  }else if(kind==='srv'){
    it.x=false;
    if(f==='base'){save();render();return;}
  }else if(kind==='ped'){
    if(f==='valor'||f==='cli'||f==='prazo') it.x=false;
  }
  edit();
}
view.addEventListener('input',onField);
view.addEventListener('change',onField);
function updNewVal(){
  var s=findSrv($('n-s').value),q=nz($('n-q').value);
  if(s&&!V.nvT) $('n-v').value=numStr(nz(s.preco)*(q>0?q:1));
}
var delTimer=null;
function confirmDel(b,label){
  if(!b.classList.contains('sure')){
    b.classList.add('sure');b.textContent='Confirmar remoção';
    clearTimeout(delTimer);
    delTimer=setTimeout(function(){if(b.isConnected){b.classList.remove('sure');b.textContent=label;}},3000);
    return false;
  }
  return true;
}
function clearScope(scope){
  if(scope==='mat'||scope==='all') S.mat.forEach(function(m){if(m.x){m.custo='';m.rend='';m.x=false;}});
  if(scope==='stk'||scope==='all') S.mat.forEach(function(m){if(m.xe){m.est='';m.min='';m.xe=false;}});
  if(scope==='srv'||scope==='all') S.srv=S.srv.filter(function(s){return !s.x;});
  if(scope==='ped'||scope==='all') S.ped=S.ped.filter(function(o){return !o.x;});
}
function shopText(C){
  var shop=shopLines(C);
  if(!shop.length) return 'Nada para repor agora.';
  var lines=['Lista de compras · Lav Shoes'];
  shop.forEach(function(r){lines.push('- '+r.m.nome+': '+buyLabel(r.m,r.i.comprar)+(r.m.forn?' ('+r.m.forn+')':'')+' · cerca de '+brl(r.i.gasto));});
  lines.push('Total estimado: '+brl(shop.reduce(function(a,r){return a+r.i.gasto;},0)));
  return lines.join('\n');
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]');if(!b) return;
  var act=b.dataset.act,row=b.closest('[data-id]'),id=row?row.dataset.id:null;
  if(act==='go'){goTab(b.dataset.tab);return;}
  if(act==='filt'){V[b.dataset.k]=b.dataset.v;render();return;}
  if(act==='mprev'||act==='mnext'){
    var d=parseISO(V.ym+'-01');d.setMonth(d.getMonth()+(act==='mprev'?-1:1));V.ym=fmtISO(d).slice(0,7);render();return;
  }
  if(act==='clear'){clearScope(b.dataset.scope);render();save();toast('Exemplos removidos');return;}
  if(act==='add-mat'){
    var next=0;S.mat.forEach(function(m){next=Math.max(next,m.c+1);});
    var m={id:uid('m'),k:'',c:next%8,nome:'Novo material',cats:[V.mf!=='todas'?V.mf:'limpeza'],outra:'',un:'un',qemb:'',custo:'',rend:'',inc:false,est:'',min:'',lead:'3',forn:'',x:false,xe:false};
    S.mat.push(m);V.newId=m.id;render();save();
    var el=$('nm-'+m.id);if(el){el.focus();el.select();}
    return;
  }
  if(act==='tgl-cat'){
    var mc=findMat(id);if(!mc) return;
    mc.cats=mc.cats||[];
    var cx=b.dataset.cat,ci=mc.cats.indexOf(cx);
    if(ci>-1) mc.cats.splice(ci,1);else mc.cats.push(cx);
    b.setAttribute('aria-pressed',String(ci===-1));
    if(cx==='outra'){var ob=row.querySelector('[data-outra]');if(ob){ob.hidden=ci>-1;if(ci===-1){var oi=row.querySelector('[data-f="outra"]');if(oi) oi.focus();}}}
    edit();return;
  }
  if(act==='del-mat'){
    if(!confirmDel(b,'Remover')) return;
    S.mat=S.mat.filter(function(m){return m.id!==id;});
    S.srv.forEach(function(s){s.uso=s.uso.filter(function(u){return u!==id;});});
    render();save();return;
  }
  if(act==='copy-sum'){
    var C=ctx(),lines=['Lav Shoes · custo de material por par'];
    S.mat.forEach(function(m){var c=cpOf(m);lines.push((m.nome||'Sem nome')+(num(m.qemb)>0?' ('+pkgLabel(m)+')':'')+': '+(c!==null?brl(c):'—')+(m.inc?'':' (só em alguns serviços)'));});
    lines.push('Total base por par: '+brl(C.base.total));
    copyText(lines.join('\n'));return;
  }
  if(act==='copy-shop'){copyText(shopText(ctx()));return;}
  if(act==='stk-step'){
    var m2=findMat(id);if(!m2) return;
    var cur=nz(m2.est),nv=Math.max(0,Math.round((cur+(+b.dataset.d))*100)/100);
    m2.est=numStr(nv);m2.xe=false;
    var inp=$('es-'+id);if(inp) inp.value=m2.est;
    edit();return;
  }
  if(act==='buy-toggle'){var bx=row.querySelector('.buy');bx.hidden=!bx.hidden;if(!bx.hidden){var q=$('bq-'+id);if(q) q.focus();}return;}
  if(act==='buy-ok'){
    var m3=findMat(id),q3=num($('bq-'+id).value),t3=num($('bt-'+id).value);
    if(!m3||!(q3>0)){toast('Informe a quantidade comprada');return;}
    m3.est=numStr(nz(m3.est)+q3);m3.xe=false;
    if(t3>=0){m3.custo=numStr(t3/q3);m3.x=false;}
    render();save();toast('Compra registrada em '+(m3.nome||'estoque'));return;
  }
  if(act==='tgl-uso'){
    var s=findSrv(id);if(!s) return;
    var mid=b.dataset.mid,ix=s.uso.indexOf(mid);
    if(ix>-1) s.uso.splice(ix,1);else s.uso.push(mid);
    s.x=false;
    b.setAttribute('aria-pressed',String(ix===-1));
    edit();return;
  }
  if(act==='add-srv'){
    var ns={id:uid('sv'),nome:'Novo serviço',preco:'',min:'',base:true,uso:[],x:false};
    S.srv.push(ns);render();save();
    var el2=$('sn-'+ns.id);if(el2){el2.focus();el2.select();}
    return;
  }
  if(act==='del-srv'){
    if(!confirmDel(b,'Remover')) return;
    S.srv=S.srv.filter(function(s){return s.id!==id;});render();save();return;
  }
  if(act==='apply-price'){
    var s2=findSrv(id),sg=b.dataset.sug;if(!s2||!sg) return;
    s2.preco=numStr(+sg);s2.x=false;
    var pi=$('sp-'+id);if(pi) pi.value=s2.preco;
    edit();toast('Preço atualizado para '+brl(+sg));return;
  }
  if(act==='add-ped'){
    var sv=findSrv($('n-s').value),q4=nz($('n-q').value);
    if(!sv){toast('Escolha um serviço');return;}
    if(!(q4>0)){toast('Informe a quantidade de pares');return;}
    var c=srvCalc(S,sv),val=num($('n-v').value);
    var o={id:uid('po'),cli:$('n-cli').value.trim().slice(0,60),s:sv.id,q:String(q4),prazo:$('n-d').value||addDays(TODAY,3),st:'recebido',valor:numStr(isNaN(val)?nz(sv.preco)*q4:val),cm:(c.cm*q4).toFixed(4),baixa:false,ent:'',cr:TODAY,x:false};
    S.ped.push(o);V.nvT=false;V.pf='abertos';render();save();toast('Pedido adicionado');return;
  }
  if(act==='ped-next'||act==='ped-back'){
    var po=findPed(id);if(!po) return;
    var i=STAT.indexOf(po.st),ni=act==='ped-next'?Math.min(4,i+1):Math.max(0,i-1);
    var used=setStatus(S,po,STAT[ni],TODAY);
    render();save();
    if(used.length) toast('Baixa no estoque: '+plural(used.length,'item','itens'));
    else if(act==='ped-next'&&ni===4) toast('Pedido entregue');
    return;
  }
  if(act==='del-ped'){
    if(!confirmDel(b,'Remover')) return;
    S.ped=S.ped.filter(function(o){return o.id!==id;});render();save();return;
  }
});

render();
connectDb();
})();
</script>

</body></html>
